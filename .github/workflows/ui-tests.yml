name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression
        default: "@smoke"
      browser:
        description: chrome | edge | firefox
        default: chrome

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Cucumber suite (headless)
        env:
          # Real credentials belong in repository secrets, never in the repo.
          USER_STANDARD_PASSWORD: ${{ secrets.USER_STANDARD_PASSWORD || 'secret_sauce' }}
        run: >
          mvn -B verify
          -Dheadless=true
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dthreads=2
          -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke' }}"

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ github.run_number }}
          path: |
            target/cucumber-reports
            target/cucumber-html-report
            target/screenshots
            target/logs
          if-no-files-found: ignore
